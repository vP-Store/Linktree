name: NovaOS – Windows-Build

on:
  push:
    paths:
      - 'nova-os/**'
      - '.github/workflows/novaos-windows.yml'
  workflow_dispatch:

concurrency:
  group: novaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-Prüfung
        run: node scripts/check.js
      - name: Unit-Tests
        run: node --test tests/unit.test.mjs
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Browser für Tests
        run: npx playwright install --with-deps chromium
      - name: Oberflächen-Tests (Gauntlet)
        run: npx playwright test --reporter=line

  build-windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nova-os
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Installer + portable EXE bauen
        run: npx electron-builder --win nsis portable --publish never
      - name: Rauchtest – NovaOS.exe unter Windows starten
        shell: pwsh
        run: |
          $env:NOVA_SMOKE = "$PWD\smoke.png"
          $env:NOVA_SMOKE_LOG = "$PWD\smoke.log"
          $env:NOVA_SMOKE_JS = node -e "process.stdout.write(require('./scripts/smoke.js'))"
          $p = Start-Process -FilePath "dist\win-unpacked\NovaOS.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "NovaOS hat sich nicht beendet" }
          Get-Content smoke.log
          if (-not (Test-Path smoke.png)) { throw "Kein Screenshot erzeugt" }
          $log = Get-Content smoke.log -Raw
          if ($log -match '\[smoke\] Fehler') { throw "Rauchtest fehlgeschlagen" }
          if ($log -match 'FEHLER:') { throw "Mindestens eine Prüfung im Rauchtest ist fehlgeschlagen" }
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-Windows
          path: |
            nova-os/dist/*.exe
          if-no-files-found: error
      - name: Rauchtest-Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-Rauchtest
          path: |
            nova-os/smoke.png
            nova-os/smoke.log
          if-no-files-found: ignore
